name: finance-smith

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: finance-smith:local
    # Use host network for consistency with the db service: avoids veth-pair
    # issues on WSL2/VM setups and lets DATABASE_URL resolve to 127.0.0.1:5432.
    network_mode: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Non-secret overrides. All secrets come from secrets.enc.env via SOPS.
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: ${PORT:-4000}
      LOG_DIR: /app/logs
    volumes:
      - app_logs:/app/logs
    secrets:
      - age_key

  db:
    image: postgres:17
    # Use host network to avoid veth pair creation (fixes "operation not supported"
    # in environments where bridge networking is restricted, e.g. some WSL2/VM setups).
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finance_smith_dev}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-finance_smith_test}
    # With network_mode: host, the container listens on host's 5432; no port mapping.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    profiles: ['debug']
    # Same rationale as `db`: bridge + port publish creates veth pairs; some hosts
    # (WSL2, VMs, restricted kernels) fail with "operation not supported". Host
    # network binds Adminer on localhost:8080 and reaches Postgres at 127.0.0.1:5432.
    network_mode: host
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Opt-in (like adminer's `debug` profile): not started by plain `docker compose up`.
    # Enable with: docker compose --profile tunnel up -d
    # Requires CLOUDFLARE_TUNNEL_TOKEN in the environment or .env.
    profiles: ['tunnel']
    # Uses host network so the tunnel can reach Phoenix at http://localhost:4000
    # (the same pattern as the db service). Routing rules are managed via the
    # Cloudflare Zero Trust dashboard; no ports are published here.
    network_mode: host
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  postgres_data:
  app_logs:

secrets:
  age_key:
    # The age private key used by SOPS to decrypt secrets.enc.env at boot.
    # Generate once with: age-keygen -o age.key && chmod 600 age.key
    # age.key is gitignored and must never be committed.
    file: ./age.key
