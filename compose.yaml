name: finance-smith

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finance_smith_dev}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-finance_smith_test}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    profiles: ['debug']
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
