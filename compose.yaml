name: finance-smith

services:
  db:
    image: postgres:17
    # Use host network to avoid veth pair creation (fixes "operation not supported"
    # in environments where bridge networking is restricted, e.g. some WSL2/VM setups).
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finance_smith_dev}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-finance_smith_test}
    # With network_mode: host, the container listens on host's 5432; no port mapping.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    profiles: ['debug']
    ports:
      - '8080:8080'
    # When db uses network_mode: host, use server "host.docker.internal" in Adminer UI.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Uses host network so the tunnel can reach Phoenix at http://localhost:4000
    # (the same pattern as the db service). Routing rules are managed via the
    # Cloudflare Zero Trust dashboard; no ports are published here.
    network_mode: host
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  postgres_data:
